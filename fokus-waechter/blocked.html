<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pause – Fokus-Wächter</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    main { max-width: 520px; width: 100%; text-align: center; }
    .icon { width: 64px; height: 64px; margin: 0 auto 20px; }
    h1 { font-size: 30px; margin-bottom: 10px; }
    .lead { font-size: 17px; margin: 0 0 28px; }
    .stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 28px; }
    .stats strong { display: block; font-size: 26px; }
    .ideas { text-align: left; margin-bottom: 24px; }
    .ideas h2 { font-size: 15px; margin-bottom: 8px; }
    .ideas ul { margin: 0; padding-left: 20px; }
    .ideas li { margin: 4px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .note { font-size: 13px; margin-top: 14px; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icons/icon128.png" alt="">
    <h1 id="title">Zeit für eine Pause</h1>
    <p class="lead muted" id="lead"></p>

    <div class="stats" id="stats">
      <div><strong class="num" id="used">–</strong><span class="muted">heute genutzt</span></div>
      <div><strong class="num" id="limit">–</strong><span class="muted">Tageslimit</span></div>
    </div>

    <div class="card ideas">
      <h2>Wie wäre es stattdessen mit …</h2>
      <ul id="ideas"></ul>
    </div>

    <div class="actions">
      <button class="primary" id="close">Tab schließen</button>
      <button id="extend" hidden></button>
      <button id="back" hidden></button>
    </div>
    <p class="note muted" id="note"></p>
  </main>
  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
