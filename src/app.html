<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formkurve</title>
<style>
/*@FONTS@*/

/* ============ Tokens ============ */
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F2F5F7; --surface-3:#E4E9ED;
  --line:#D2D9E0; --line-strong:#B9C3CC;
  --ink:#12171C; --ink-2:#4B5661; --ink-3:#7A8792;
  --train:#1F5FD0; --train-ink:#173F8A; --train-soft:rgba(31,95,208,.10);
  --fuel:#A9640A; --fuel-ink:#7A4707; --fuel-soft:rgba(169,100,10,.11);
  --good:#1B7A4C; --good-soft:rgba(27,122,76,.12);
  --warn:#A9640A;
  --crit:#BE3A2E; --crit-soft:rgba(190,58,46,.11);
  --shadow:0 1px 2px rgba(18,23,28,.05), 0 10px 28px -16px rgba(18,23,28,.28);
  --r-card:12px; --r-field:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --surface:#161C22; --surface-2:#1D242B; --surface-3:#252E36;
    --line:#2A333C; --line-strong:#3A454F;
    --ink:#E7ECF1; --ink-2:#A5B2BE; --ink-3:#76838F;
    --train:#71A5FF; --train-ink:#A9C7FF; --train-soft:rgba(113,165,255,.14);
    --fuel:#E0A24E; --fuel-ink:#F0C489; --fuel-soft:rgba(224,162,78,.14);
    --good:#54C08A; --good-soft:rgba(84,192,138,.15);
    --warn:#E0A24E;
    --crit:#FF7C6C; --crit-soft:rgba(255,124,108,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#161C22; --surface-2:#1D242B; --surface-3:#252E36;
  --line:#2A333C; --line-strong:#3A454F;
  --ink:#E7ECF1; --ink-2:#A5B2BE; --ink-3:#76838F;
  --train:#71A5FF; --train-ink:#A9C7FF; --train-soft:rgba(113,165,255,.14);
  --fuel:#E0A24E; --fuel-ink:#F0C489; --fuel-soft:rgba(224,162,78,.14);
  --good:#54C08A; --good-soft:rgba(84,192,138,.15);
  --warn:#E0A24E;
  --crit:#FF7C6C; --crit-soft:rgba(255,124,108,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
}

/* ============ Base ============ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--train); outline-offset:2px; border-radius:4px}
.mono{font-family:'Geist Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.disp{font-family:'Big Shoulders',Impact,sans-serif; font-weight:700; letter-spacing:.005em}
.hide{display:none !important}

/* ============ Shell ============ */
.wrap{max-width:960px; margin:0 auto; padding:0 16px}
header.top{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.brandrow{display:flex; align-items:center; gap:12px; padding:10px 0 8px}
.mark{
  width:26px; height:26px; flex:none; border-radius:5px; background:var(--ink);
  display:grid; place-items:center; color:var(--surface);
  font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:20px; line-height:1;
  padding-top:2px;
}
.brand{font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:27px; line-height:1; text-transform:uppercase; letter-spacing:.02em}
.brandsub{font-size:11px; color:var(--ink-3); letter-spacing:.09em; text-transform:uppercase; font-family:'Geist Mono',monospace}
.topspacer{flex:1}
.iconbtn{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-field);
  padding:6px 10px; font-size:12px; color:var(--ink-2);
}
.iconbtn:hover{border-color:var(--line-strong); color:var(--ink)}

/* status rail */
.rail{display:flex; gap:0; border-top:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-item{flex:1 0 auto; min-width:118px; padding:8px 14px 9px; border-right:1px solid var(--line)}
.rail-item:last-child{border-right:0}
.rail-k{font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.rail-v{font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:23px; line-height:1.1; font-variant-numeric:tabular-nums}
.rail-v small{font-family:'Instrument Sans',sans-serif; font-weight:400; font-size:12px; color:var(--ink-3)}

/* tabs */
nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; border-top:1px solid var(--line); background:var(--surface-2)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto; background:none; border:0; border-bottom:2px solid transparent;
  padding:9px 14px 8px; font-size:13px; color:var(--ink-3); white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--train); background:var(--surface)}

main{padding:18px 0 72px}
.stack{display:flex; flex-direction:column; gap:14px}

/* ============ Cards ============ */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card);
  box-shadow:var(--shadow); overflow:hidden;
}
.card-h{display:flex; align-items:baseline; gap:10px; padding:13px 16px 11px; border-bottom:1px solid var(--line)}
.card-h h2{font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:22px; line-height:1; text-transform:uppercase; letter-spacing:.02em}
.card-h .sub{font-size:12px; color:var(--ink-3); margin-left:auto; text-align:right}
.card-b{padding:14px 16px}
.card-b.tight{padding:0}

.eyebrow{font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}

/* chips */
.chip{
  display:inline-flex; align-items:center; gap:5px; border-radius:999px;
  padding:3px 9px; font-size:11.5px; font-weight:600; white-space:nowrap;
  border:1px solid transparent;
}
.chip.train{background:var(--train-soft); color:var(--train-ink); border-color:var(--train-soft)}
.chip.fuel{background:var(--fuel-soft); color:var(--fuel-ink)}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.crit{background:var(--crit-soft); color:var(--crit)}
.chip.mute{background:var(--surface-2); color:var(--ink-3); border-color:var(--line)}
.card .card{box-shadow:none}

/* ============ Forms ============ */
.field{display:flex; flex-direction:column; gap:5px}
.field > label{font-size:12.5px; color:var(--ink-2); font-weight:600}
.field .hint{font-size:11.5px; color:var(--ink-3)}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-field);
  padding:9px 10px; width:100%; -moz-appearance:textfield;
}
input:hover,select:hover{border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--train); box-shadow:0 0 0 3px var(--train-soft)}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
/* schmale Zahlenfelder bleiben auch auf dem Handy nebeneinander */
.grid3.narrow{gap:8px}
@media (max-width:560px){
  .grid3:not(.narrow),.grid4{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}

/* option cards (radio/checkbox) */
.opts{display:grid; gap:9px}
.opts.c2{grid-template-columns:repeat(2,1fr)}
.opts.c3{grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){.opts.c3{grid-template-columns:repeat(2,1fr)} .opts.c2{grid-template-columns:1fr}}
.opt{
  position:relative; display:block; background:var(--surface-2); border:1px solid var(--line);
  border-radius:10px; padding:11px 12px; cursor:pointer; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--line-strong)}
.opt input{position:absolute; opacity:0; pointer-events:none}
.opt .t{font-weight:700; font-size:14px; display:block}
.opt .d{font-size:12px; color:var(--ink-3); display:block; margin-top:2px; line-height:1.4}
.opt:has(input:checked){border-color:var(--train); background:var(--train-soft); box-shadow:inset 0 0 0 1px var(--train)}
.opt:has(input:focus-visible){outline:2px solid var(--train); outline-offset:2px}

/* buttons */
.btn{
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
  border-radius:var(--r-field); padding:9px 14px; font-size:14px; font-weight:600;
}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--train); border-color:var(--train); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0A0F14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0A0F14}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; border-color:var(--line)}
.btn.sm{padding:5px 10px; font-size:12.5px}
.btn.wide{width:100%}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}

/* ============ Onboarding ============ */
.wizard{min-height:calc(100vh - 52px); display:flex; flex-direction:column; justify-content:center; padding:26px 0 60px}
.wiz-hero{margin-bottom:22px}
.wiz-hero .kicker{font-family:'Geist Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--train)}
.wiz-hero h1{font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:clamp(44px,9vw,78px); line-height:.92; text-transform:uppercase; margin:6px 0 8px}
.wiz-hero p{color:var(--ink-2); max-width:56ch}
.steps{display:flex; gap:4px; margin-bottom:14px}
.stepdot{height:3px; flex:1; background:var(--line); border-radius:2px}
.stepdot.on{background:var(--train)}
.stepdot.done{background:var(--train); opacity:.45}
.wizhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.wizhead .n{font-family:'Geist Mono',monospace; font-size:12px; color:var(--ink-3); white-space:nowrap}
.wizhead h2{font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:32px; line-height:1; text-transform:uppercase}
.wizhead .q{font-size:13px; color:var(--ink-3); margin-left:auto}
@media (max-width:560px){
  .wizhead{gap:2px 8px}
  .wizhead .n{order:1; width:100%}
  .wizhead h2{order:2; width:100%; font-size:29px}
  .wizhead .q{order:3; width:100%; margin-left:0}
}

/* ============ Plan / tables ============ */
.dayhead{
  display:flex; align-items:center; gap:10px; padding:11px 16px;
  background:var(--surface-2); border-bottom:1px solid var(--line);
}
.dayhead .wd{
  font-family:'Geist Mono',monospace; font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); min-width:26px;
}
.dayhead .nm{font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:21px; line-height:1; text-transform:uppercase}
.dayhead .meta{margin-left:auto; font-size:12px; color:var(--ink-3)}

.exrow{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:10px 16px; border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{font-weight:600; font-size:14px}
.exrow .tag{font-size:11.5px; color:var(--ink-3)}
.exrow .rx{
  font-family:'Geist Mono',monospace; font-size:13px; font-variant-numeric:tabular-nums;
  white-space:nowrap; text-align:right; align-self:center;
}
.exrow .rx b{font-weight:700}
.exrow .rx .x{color:var(--ink-3)}

/* set logger */
.setgrid{display:grid; grid-template-columns:22px 1fr 1fr 34px; gap:6px; align-items:center; margin-bottom:6px}
.setgrid .si{font-family:'Geist Mono',monospace; font-size:12px; color:var(--ink-3); text-align:center}
.setgrid input{padding:7px 8px; text-align:center; font-family:'Geist Mono',monospace; font-variant-numeric:tabular-nums}
.setgrid .tick{
  border:1px solid var(--line); background:var(--surface-2); border-radius:6px;
  height:34px; display:grid; place-items:center; font-size:14px; color:var(--ink-3);
}
.setgrid .tick.on{background:var(--good-soft); border-color:var(--good); color:var(--good)}
.setlabels{display:grid; grid-template-columns:22px 1fr 1fr 34px; gap:6px; margin-bottom:4px}
.setlabels span{font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); text-align:center}

.exlog{border-bottom:1px solid var(--line); padding:12px 16px}
.exlog:last-child{border-bottom:0}
.exlog-h{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.exlog-h .nm{font-weight:700; font-size:14.5px}
.exlog-h .rx{font-family:'Geist Mono',monospace; font-size:12px; color:var(--ink-3); margin-left:auto}
.lastline{font-family:'Geist Mono',monospace; font-size:11.5px; color:var(--ink-3); margin-bottom:7px}
.cue{font-size:12px; color:var(--ink-3); margin-top:6px; padding-left:9px; border-left:2px solid var(--line)}

/* meters */
.meter{height:7px; background:var(--surface-3); border-radius:4px; overflow:hidden; position:relative}
.meter i{display:block; height:100%; border-radius:4px; background:var(--train); transition:width .25s}
.meter i.fuel{background:var(--fuel)}
.meter i.over{background:var(--crit)}
.macrorow{display:grid; grid-template-columns:64px 1fr 96px; gap:10px; align-items:center; margin-bottom:9px}
.macrorow .lbl{font-size:12.5px; font-weight:600}
.macrorow .val{font-family:'Geist Mono',monospace; font-size:12px; text-align:right; color:var(--ink-2); font-variant-numeric:tabular-nums}

.bignum{display:flex; align-items:baseline; gap:8px}
.bignum .v{font-family:'Big Shoulders',sans-serif; font-weight:700; font-size:52px; line-height:.9; font-variant-numeric:tabular-nums}
.bignum .u{font-family:'Geist Mono',monospace; font-size:12px; color:var(--ink-3)}

/* lists */
.lrow{display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid var(--line); font-size:13.5px}
.lrow:last-child{border-bottom:0}
.lrow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lrow .kc{font-family:'Geist Mono',monospace; font-size:13px; font-variant-numeric:tabular-nums}
.lrow .mac{font-family:'Geist Mono',monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.del{background:none; border:0; color:var(--ink-3); font-size:15px; padding:0 2px; line-height:1}
.del:hover{color:var(--crit)}

.presets{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.preset{
  background:var(--surface-2); border:1px solid var(--line); border-radius:999px;
  padding:5px 10px; font-size:12px; color:var(--ink-2);
}
.preset:hover{border-color:var(--fuel); color:var(--fuel-ink); background:var(--fuel-soft)}

.empty{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:13.5px}
.note{
  font-size:12.5px; color:var(--ink-2); background:var(--surface-2);
  border-left:2px solid var(--line-strong); padding:9px 12px; border-radius:0 6px 6px 0;
}
.note.act{border-left-color:var(--fuel); background:var(--fuel-soft)}
.chart{width:100%; height:170px; display:block}
.scroller{overflow-x:auto}
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:60;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <div class="mark">F</div>
      <div>
        <div class="brand">Formkurve</div>
        <div class="brandsub">Training × Kalorien</div>
      </div>
      <div class="topspacer"></div>
      <button class="iconbtn" id="themeBtn" title="Hell / Dunkel">◐</button>
    </div>
  </div>
  <div class="wrap" id="railWrap"><div class="rail" id="rail"></div></div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>

<main class="wrap"><div id="view"></div></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   Formkurve — Trainingsplan + Kalorien in einem
   Alle Daten bleiben lokal im Browser (localStorage).
   ========================================================================== */

const KEY = "formkurve.v1";
const WD  = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

/* ---------- Übungsdatenbank -------------------------------------------------
   [id, Name, Muskelgruppe, c|i, Umgebung, Einschränkungen, Cue]
   Umgebung: g=Studio  d=Kurzhanteln/Home  b=Bänder  w=Körpergewicht
---------------------------------------------------------------------------- */
const RAW = [
// Brust
["bp","Bankdrücken Langhantel","brust","c","g","schulter","Schulterblätter zusammen, Ellbogen ~45°."],
["bpdb","Bankdrücken Kurzhantel","brust","c","gd","","Am tiefsten Punkt Dehnung spüren, nicht abfedern."],
["incdb","Schrägbank Kurzhantel","brust","c","gd","","30–35° Neigung, Handgelenke gerade."],
["incbb","Schrägbankdrücken Langhantel","brust","c","g","schulter","Stange zur oberen Brust führen."],
["chpress","Brustpresse Maschine","brust","c","g","","Sitz so, dass Griffe auf Brusthöhe sind."],
["pushup","Liegestütze","brust","c","gdbw","","Körper bleibt eine Linie, Po anspannen."],
["dips","Dips","brust","c","gw","schulter","Leicht vorlehnen für mehr Brust."],
["cfly","Kabel-Fly","brust","i","g","","Leichte Ellbogenbeugung halten, Brust zusammendrücken."],
["dbfly","Kurzhantel-Fly","brust","i","gd","schulter","Kontrolliert öffnen, nur bis Brusthöhe."],
["bfly","Band-Fly","brust","i","b","","Am Endpunkt 1 Sekunde halten."],
["pushele","Liegestütze erhöht","brust","c","w","","Hände auf Stuhl/Tisch für leichtere Variante."],
// Rücken vertikal
["pullup","Klimmzüge","ruecken","c","gw","","Brust zur Stange, Schulterblätter zuerst."],
["latpull","Latzug","ruecken","c","g","","Ellbogen nach unten-hinten ziehen."],
["blat","Band-Latzug","ruecken","c","b","","Band über Türanker, Zug bis zur Brust."],
["negpull","Negativ-Klimmzüge","ruecken","c","gw","","3–5 s kontrolliert ablassen."],
["pullover","Überzüge","ruecken","i","gd","schulter","Nur so weit, wie die Rippen unten bleiben."],
// Rücken horizontal
["bbrow","Langhantelrudern","ruecken","c","g","ruecken","Rücken flach, Zug zum Bauchnabel."],
["dbrow","Kurzhantelrudern einarmig","ruecken","c","gd","","Hüfte bleibt parallel, kein Rotieren."],
["cabrow","Kabelrudern sitzend","ruecken","c","g","","Brust raus, Ellbogen eng am Körper."],
["tbar","T-Bar Rudern","ruecken","c","g","ruecken","Neutraler Rücken, kein Schwung."],
["brow","Band-Rudern","ruecken","c","b","","Band um die Füße, Ellbogen nach hinten."],
["invrow","Sling-/Schrägrudern","ruecken","c","gw","","Je flacher der Körper, desto schwerer."],
["facep","Face Pull","rdelt","i","gb","","Auf Augenhöhe ziehen, Daumen nach hinten."],
["revfly","Reverse Fly","rdelt","i","gd","","Leicht vorgebeugt, Arme fast gestreckt."],
// Beine – Quadrizeps
["squat","Kniebeuge Langhantel","quad","c","g","knie,ruecken","Knie folgen den Fußspitzen, Tiefe nach Beweglichkeit."],
["goblet","Goblet Squat","quad","c","gd","knie","Gewicht vor der Brust, Oberkörper aufrecht."],
["legpress","Beinpresse","quad","c","g","knie","Unterer Rücken bleibt am Polster."],
["bulg","Bulgarian Split Squat","quad","c","gdw","knie","Hinteres Bein nur zum Balancieren nutzen."],
["lunge","Ausfallschritte","quad","c","gdw","knie","Schritt lang genug, Knie über dem Fuß."],
["legext","Beinstrecker","quad","i","g","knie","Oben kurz halten, langsam ablassen."],
["bwsq","Körpergewicht-Kniebeuge","quad","c","w","","Langsam runter, 2 s halten, explosiv hoch."],
["stepup","Step-Ups","quad","c","gdw","knie","Kraft aus dem oberen Bein, nicht abdrücken."],
["hack","Hack Squat","quad","c","g","knie","Füße mittig, ganze Fußsohle belastet."],
// Beine – Hüfte / Rückseite
["dl","Kreuzheben","ham","c","g","ruecken","Stange am Körper, Hüfte und Brust steigen gleichzeitig."],

/* ==========================================================================
   Rechenkern: Kalorien & Makros
   ========================================================================== */
function calcNutrition(p, adjust){
  const kg = p.weight, cm = p.height, age = p.age;
  // Grundumsatz: Katch-McArdle wenn Körperfett bekannt, sonst Mifflin-St Jeor
  let bmr;
  if(p.bodyfat && p.bodyfat > 3 && p.bodyfat < 60){
    const lbm = kg * (1 - p.bodyfat/100);
    bmr = 370 + 21.6 * lbm;
  } else {
    bmr = 10*kg + 6.25*cm - 5*age + (p.sex === "m" ? 5 : -161);
  }
  const NEAT = {sitzend:1.20, leicht:1.35, mittel:1.50, hoch:1.65}[p.activity] || 1.35;
  const base = bmr * NEAT;                       // Verbrauch ohne Training
  const burn = 0.075 * kg * p.sessionLen;        // ~0,075 kcal/kg/min Krafttraining
  const weekly = base*7 + burn*p.days;
  const avg = weekly/7;

  const GOAL = {abnehmen:-0.18, form:-0.05, aufbau:0.12}[p.goal];
  let target = avg * (1 + GOAL) + (adjust||0);
  target = Math.max(target, bmr * 1.1);          // Sicherheitsuntergrenze

  // Kalorien-Zyklus: an Trainingstagen mehr, an Ruhetagen weniger (Wochensumme bleibt gleich).
  // Bei vielen Trainingstagen müssen wenige Ruhetage die ganze Umverteilung tragen — deshalb
  // wird die Verschiebung so gedeckelt, dass ein Ruhetag nie unter 85 % des Ziels fällt.
  const restDays = 7 - p.days;
  let shift = 0;
  if(restDays > 0){
    shift = Math.min(burn * 0.6, 400, (target * 0.15 * restDays) / p.days);
  }
  const rest = restDays > 0 ? target - (shift*p.days)/restDays : target;
  const train = target + shift;

  // Makros
  const refKg = (p.bodyfat && p.bodyfat > 25) ? kg * (1 - (p.bodyfat-20)/100) : kg;
  const pPerKg = {abnehmen:2.2, form:2.0, aufbau:1.8}[p.goal];
  const protein = r0(refKg * pPerKg);
  const fat = r0(Math.max(refKg * 0.8, target * 0.20 / 9));

  const macrosFor = kcal => {
    const carbs = Math.max(30, r0((kcal - protein*4 - fat*9) / 4));
    return {kcal:r0(kcal), protein, fat, carbs};
  };
  return {
    bmr:r0(bmr), base:r0(base), burn:r0(burn), tdee:r0(avg), target:r0(target),
    train:macrosFor(train), rest:macrosFor(rest), avgM:macrosFor(target),
    proteinPerKg:pPerKg, water:r1(kg*0.035)
  };
}

/* Zielrate der Gewichtsveränderung in % Körpergewicht pro Woche */
const targetRate = goal => ({abnehmen:-0.6, form:0, aufbau:0.25}[goal]);

/* Gewichtstrend: gleitender 7-Tage-Schnitt, Vergleich zur Vorwoche */
function weightTrend(){
  const w = (S.logs.weights||[]).slice().sort((a,b)=> a.date<b.date?-1:1);
  if(!w.length) return null;
  if(w.length === 1) return {current:w[0].kg, avg7:w[0].kg, ready:false, n:1};
  const t = today();
  const avgIn = (from,to)=>{
    const sel = w.filter(x=> x.date > from && x.date <= to);
    return sel.length ? {v: sel.reduce((s,x)=>s+x.kg,0)/sel.length, n:sel.length} : null;
  };
  const cur = avgIn(dPlus(t,-7), t);
  const prev = avgIn(dPlus(t,-14), dPlus(t,-7));
  const last = w[w.length-1];
  if(!cur || !prev || cur.n < 2 || prev.n < 2) return {current:last.kg, avg7:cur?cur.v:last.kg, ready:false, n:w.length};
  const deltaKg = cur.v - prev.v;
  const pct = (deltaKg / cur.v) * 100;
  return {current:last.kg, avg7:cur.v, prev7:prev.v, deltaKg, pct, ready:true, n:w.length};
}

/* Kalorien-Empfehlung aus dem Trend */
function kcalSuggestion(){
  const tr = weightTrend();
  if(!tr || !tr.ready) return null;
  const goal = S.profile.goal, want = targetRate(goal), diff = tr.pct - want;
  if(Math.abs(diff) < 0.22) return {ok:true, tr, want, diff};
  // 1 kg Körpermasse ≈ 7700 kcal
  let delta = -(diff/100) * tr.avg7 * 7700 / 7;
  delta = clamp(r0(delta/25)*25, -300, 300);
  return {ok:false, tr, want, diff, delta};
}

/* ==========================================================================
   Plangenerator
   ========================================================================== */
function buildPlan(p, seed){
  seed = seed == null ? 0 : seed;
  const allowed = ENVSET[p.equipment];
  const usable = EX.filter(e=>{
    if(![...e.env].some(c=> allowed.includes(c))) return false;
    if(e.avoid.some(a=> p.limits.includes(a))) return false;
    return true;
  });

  let key = p.days;
  if(p.days === 3 && p.level !== "anfaenger") key = "3ppl";
  const split = SPLITS[key] || SPLITS[3];

  const counter = {};                    // pro Slot-Typ rotieren -> Abwechslung
  const pickFor = (spec, usedInDay) => {
    const [grp,type] = spec.split(":");
    let pool = usable.filter(e=> e.grp===grp && e.type===type);
    if(!pool.length) pool = usable.filter(e=> e.grp===grp);
    if(!pool.length && FALLBACK[grp]) pool = usable.filter(e=> e.grp===FALLBACK[grp]);
    if(!pool.length) return null;
    const free = pool.filter(e=> !usedInDay.has(e.id));
    if(!free.length) return null;                 // keine Übung zweimal am selben Tag
    const n = (counter[spec] = (counter[spec]||0)) + seed;
    counter[spec]++;
    return free[n % free.length];
  };

  // Anzahl Übungen aus der Zeit pro Einheit ableiten
  const nEx = clamp(Math.round((p.sessionLen - 8) / 8), 4, 9);

  const days = split.days.map(([name, tpl], di) => {
    let specs = SLOTS[tpl].slice();
    // Schwerpunkte: an passenden Tagen eine Zusatzübung einbauen
    (p.focus||[]).forEach(f=>{
      if((FOCUSDAY[f]||[]).includes(tpl) && FOCUSMAP[f]) specs.splice(Math.min(3,specs.length), 0, FOCUSMAP[f]);
    });
    specs = specs.slice(0, nEx);

    const used = new Set();
    const exercises = [];
    specs.forEach((spec, i) => {
      const e = pickFor(spec, used);
      if(!e) return;
      used.add(e.id);
      exercises.push({...prescribe(e, p, i===0), id:e.id});
    });

    // Haben Einschränkungen oder fehlende Geräte Lücken gerissen: erst mit Übungen aus
    // denselben Muskelgruppen auffüllen, danach mit höchstens zwei Rumpfübungen.
    const wanted = [...new Set(specs.map(s=> s.split(":")[0]).concat(specs.map(s=> FALLBACK[s.split(":")[0]]).filter(Boolean)))];
    const fill = (grps, max) => {
      let added = 0;
      while(exercises.length < nEx && added < max){
        const cand = usable.filter(e=> !used.has(e.id) && grps.includes(e.grp));
        if(!cand.length) return;
        counter.__fill = (counter.__fill||0) + 1;
        const e = cand[(counter.__fill + seed) % cand.length];
        used.add(e.id);
        exercises.push({...prescribe(e, p, false), id:e.id});
        added++;
      }
    };
    fill(wanted.filter(g=> g !== "core"), nEx);
    fill(["core"], 2);

    return {name, tpl, weekday: p.weekdays[di] != null ? p.weekdays[di] : null,
            short: exercises.length < nEx, exercises};
  });

  return {createdAt: today(), seed, splitKey:String(key), splitName:split.name, nEx, days};
}

/* Übungen ohne Zusatzgewicht: Fortschritt läuft über Wiederholungen und schwerere
   Varianten, nicht über die Hantel — deshalb höhere Wiederholungszahlen. */
const loadless = (e, p) => p.equipment === "bw" || p.equipment === "band" || e.env === "w";

function prescribe(e, p, isFirst){
  const L = {anfaenger:{c:3,i:2,rir:3}, fortgeschritten:{c:4,i:3,rir:2}, erfahren:{c:4,i:3,rir:1}}[p.level];
  const sets = (e.type === "c" ? L.c : L.i) + (isFirst ? 1 : 0);
  const ll = loadless(e, p);
  let reps;
  if(e.grp === "core") reps = [10,20];
  else if(ll) reps = e.type === "c" ? [10,20] : [12,20];
  else if(e.type === "c") reps = p.goal === "aufbau" ? [5,8] : [6,10];
  else reps = [10,15];
  return {sets, reps, rir:L.rir, ll, rest: e.type === "c" ? 150 : 75};
}

/* Aktuelle Woche im 4-Wochen-Block */
function blockWeek(){
  if(!S.plan) return 1;
  const start = new Date(S.plan.createdAt+"T12:00:00");
  const days = Math.floor((new Date(today()+"T12:00:00") - start)/864e5);
  return (Math.floor(days/7) % 4) + 1;
}
const WEEKINFO = {
  1:{label:"Woche 1 · Einfinden", setMod:0, rirMod:1},
  2:{label:"Woche 2 · Aufbauen",  setMod:0, rirMod:0},
  3:{label:"Woche 3 · Schwer",    setMod:1, rirMod:-1},
  4:{label:"Woche 4 · Deload",    setMod:-1, rirMod:2}
};
function weekAdjusted(ex){
  const w = WEEKINFO[blockWeek()];
  const sets = Math.max(2, ex.sets + (w.setMod === -1 ? -Math.ceil(ex.sets*0.4) : w.setMod));
  return {sets, rir: clamp(ex.rir + w.rirMod, 0, 4)};
}

/* Tagesplan für ein Datum */
function planForDate(d){
  if(!S.plan) return null;
  const wd = dow(d);
  const day = S.plan.days.find(x=> x.weekday === wd);
  return day || null;
}

/* Fortschrittsvorschlag: doppelte Progression */
function lastPerformance(exId, beforeDate){
  const dates = Object.keys(S.logs.sessions).filter(d=> d < beforeDate).sort().reverse();
  for(const d of dates){
    const s = S.logs.sessions[d];
    if(s.entries && s.entries[exId] && s.entries[exId].some(x=> x && x.r)) return {date:d, sets:s.entries[exId]};
  }
  return null;
}
function suggestion(ex, last){
  const e = byId(ex.id);
  if(!last) return ex.ll
    ? "Sauber ausführen und bis " + ex.rir + " Wiederholungen vor dem Versagen gehen. Das ist dein Startwert."
    : "Startgewicht finden: letzter Satz mit " + ex.rir + " Wiederholungen im Tank.";
  const done = last.sets.filter(x=> x && x.r);
  const allTop = done.length >= ex.sets && done.every(x=> Number(x.r) >= ex.reps[1]);
  if(allTop && ex.ll) return "Alle Sätze auf " + ex.reps[1] + " → jetzt die schwerere Variante nehmen (langsamer, größerer Bewegungsumfang oder einbeinig/einarmig).";
  const step = e && e.type === "c" ? 2.5 : 1.25;
  const w = Math.max(...done.map(x=> Number(x.w)||0));
  if(allTop && w > 0) return "Alle Sätze auf " + ex.reps[1] + " → heute " + r1(w+step) + " kg, zurück auf " + ex.reps[0] + " Wdh.";
  return "Gewicht halten, eine Wiederholung mehr pro Satz als beim letzten Mal.";
}

function renderRail(){
  const n = $("#rail"); n.innerHTML = "";
  const t = today(), day = planForDate(t), nut = calcNutrition(S.profile, S.kcalAdjust);
  const tgt = day ? nut.train : nut.rest;
  const eaten = (S.logs.food[t]||[]).reduce((s,f)=> s+f.kcal, 0);
  const left = tgt.kcal - eaten;
  const tr = weightTrend();

let W = {step:0, data:{}};
function viewWizard(){
  const root = el("div","wizard");
  const d = W.data;
  const STEPS = [
    {t:"Deine Basisdaten", q:"Grundlage für den Kalorienbedarf", body:stepBasis},
    {t:"Dein Ziel", q:"Bestimmt Kalorien und Wiederholungen", body:stepZiel},
    {t:"Erfahrung", q:"Bestimmt Sätze und Intensität", body:stepLevel},
    {t:"Deine Zeit", q:"Bestimmt den Split", body:stepZeit},
    {t:"Ausrüstung", q:"Bestimmt die Übungsauswahl", body:stepEquip},
    {t:"Alltag & Einschränkungen", q:"Feinschliff", body:stepBody},
    {t:"Schwerpunkte", q:"Optional", body:stepFocus}
  ];

  if(W.step === 0){
    const hero = el("div","wiz-hero");
    hero.appendChild(el("div","kicker","Trainingsplan + Kalorien"));
    hero.appendChild(el("h1",null,"Sieben Fragen,<br>dein Plan."));
    hero.appendChild(el("p",null,"Formkurve stellt dir ein paar Fragen, baut daraus deinen Trainingsplan und rechnet die passenden Kalorien und Makros dazu — an Trainingstagen mehr, an Ruhetagen weniger. Danach passt sich beides an deinen tatsächlichen Fortschritt an."));
    root.appendChild(hero);
  }

  const st = STEPS[W.step];
  const card = el("div","card");
  const b = el("div","card-b");

  const dots = el("div","steps");
  STEPS.forEach((_,i)=> dots.appendChild(el("div","stepdot "+(i===W.step?"on":(i<W.step?"done":"")))));
  b.appendChild(dots);

  const hd = el("div","wizhead");
  hd.appendChild(el("div","n","Frage "+(W.step+1)));
  hd.appendChild(el("h2",null,esc(st.t)));
  hd.appendChild(el("div","q",esc(st.q)));
  b.appendChild(hd);

  const form = el("div","stack");
  st.body(form, d);
  b.appendChild(form);

  const row = el("div","btnrow");
  row.style.marginTop = "18px";
  if(W.step > 0){
    const back = el("button","btn ghost","Zurück");
    back.onclick = ()=>{ collect(form,d); W.step--; render(); window.scrollTo({top:0}); };
    row.appendChild(back);
  }
  const next = el("button","btn primary", W.step === STEPS.length-1 ? "Plan erstellen" : "Weiter");
  next.onclick = ()=>{
    collect(form,d);
    const err = validate(W.step, d);
    if(err){ toast(err); return; }
    if(W.step === STEPS.length-1){ finishWizard(d); }
    else { W.step++; render(); window.scrollTo({top:0}); }
  };
  row.appendChild(next);
  b.appendChild(row);

  card.appendChild(b);
  root.appendChild(card);
  return root;
}

function collect(form, d){
  form.querySelectorAll("[data-k]").forEach(n=>{
    const k = n.dataset.k;
    if(n.type === "checkbox"){
      d[k] = d[k] || [];
      const set = new Set(d[k]);
      n.checked ? set.add(n.value) : set.delete(n.value);
      d[k] = [...set];
    } else if(n.type === "radio"){
      if(n.checked) d[k] = n.value;
    } else {
      d[k] = n.type === "number" ? (n.value === "" ? null : Number(n.value)) : n.value;
    }
  });
}
function validate(step, d){
  if(step===0){
    if(!d.age || d.age<14 || d.age>90) return "Bitte ein Alter zwischen 14 und 90 eintragen.";
    if(!d.height || d.height<130 || d.height>230) return "Bitte die Größe in cm eintragen (130–230).";
    if(!d.weight || d.weight<35 || d.weight>250) return "Bitte das Gewicht in kg eintragen (35–250).";
    if(!d.sex) return "Bitte Geschlecht wählen — es beeinflusst den Grundumsatz.";
  }
  if(step===1 && !d.goal) return "Bitte ein Ziel wählen.";
  if(step===2 && !d.level) return "Bitte deine Erfahrung wählen.";
  if(step===3){
    if(!d.weekdays || !d.weekdays.length) return "Bitte mindestens einen Trainingstag wählen.";
    if(d.weekdays.length > 6) return "Höchstens 6 Trainingstage — ein Ruhetag muss sein.";
    if(!d.sessionLen) return "Bitte die Zeit pro Einheit wählen.";
  }
  if(step===4 && !d.equipment) return "Bitte deine Ausrüstung wählen.";
  if(step===5 && !d.activity) return "Bitte deinen Alltag einschätzen.";
  return null;
}

const num = (form,k,label,v,hint,min,max) => {
  const f = el("div","field");
  f.appendChild(el("label",null,esc(label)));
  const i = el("input"); i.type="number"; i.dataset.k=k; if(v!=null) i.value=v;
  if(min!=null) i.min=min; if(max!=null) i.max=max; i.step="any"; i.inputMode="decimal";
  f.appendChild(i);
  if(hint) f.appendChild(el("div","hint",esc(hint)));
  form.appendChild(f);
  return f;
};
function optGroup(form, k, label, items, val, multi, cols){
  const wrapEl = el("div","field");
  if(label) wrapEl.appendChild(el("label",null,esc(label)));
  const g = el("div","opts c"+(cols||2));
  items.forEach(([v,t,desc])=>{
    const l = el("label","opt");
    const i = el("input"); i.type = multi?"checkbox":"radio"; i.name = k; i.value = v; i.dataset.k = k;
    i.checked = multi ? (val||[]).includes(v) : val === v;
    l.appendChild(i);
    l.appendChild(el("span","t",esc(t)));
    if(desc) l.appendChild(el("span","d",esc(desc)));
    g.appendChild(l);
  });
  wrapEl.appendChild(g);
  form.appendChild(wrapEl);
}

function finishWizard(d){
  const p = {

    goal:d.goal, targetWeight:d.targetWeight||null, level:d.level,

/* ---------- Heute ---------------------------------------------------------- */
function viewHeute(){
  const root = el("div","stack");
  const t = today(), day = planForDate(t);
  const nut = calcNutrition(S.profile, S.kcalAdjust);
  const tgt = day ? nut.train : nut.rest;
  const wk = WEEKINFO[blockWeek()];

  /* Trainingskarte */
  const c = el("div","card");
  const h = el("div","card-h");
  h.appendChild(el("h2",null, day ? esc(day.name) : "Ruhetag"));
  h.appendChild(el("span","chip "+(day?"train":"mute"), esc(wk.label)));
  h.appendChild(el("div","sub", esc(WDL[dow(t)]) + ", " + fmtDE(t)));

  if(!day){
    const b = el("div","card-b stack");
    const nxt = nextTrainingDay();
    b.appendChild(el("p",null,"Heute ist Erholung — da passiert der Muskelaufbau. Nächste Einheit: <b>"+esc(nxt.name)+"</b> am "+esc(WDL[nxt.weekday])+"."));

  } else {
    const sess = S.logs.sessions[t] || {dayName:day.name, entries:{}};
    const body = el("div","card-b tight");
    day.exercises.forEach(ex=>{
      const e = byId(ex.id); if(!e) return;
      const adj = weekAdjusted(ex);
      const box = el("div","exlog");
      const eh = el("div","exlog-h");
      eh.appendChild(el("div","nm",esc(e.name)));
      eh.appendChild(el("span","chip mute",esc(GRPNAME[e.grp]||e.grp)));
      eh.appendChild(el("div","rx", adj.sets+" × "+ex.reps[0]+"–"+ex.reps[1]+" · RIR "+adj.rir+" · "+ex.rest+" s Pause"));
      box.appendChild(eh);

      const last = lastPerformance(ex.id, t);
      box.appendChild(el("div","lastline", last
        ? "Zuletzt "+fmtDE(last.date)+": "+last.sets.filter(x=>x&&x.r).map(x=> (x.w||0)+" kg × "+x.r).join("  ·  ")
        : "Noch keine Werte aufgezeichnet."));

      const labels = el("div","setlabels");
      ["", ex.ll ? "Zusatz-kg" : "kg", "Wdh.", ""].forEach(l=> labels.appendChild(el("span",null,esc(l))));
      box.appendChild(labels);

      for(let i=0;i<adj.sets;i++){
        const row = el("div","setgrid");
        const cur = (sess.entries[ex.id]||[])[i] || {};
        // Bei Körpergewichtsübungen zählt die Wiederholung, das Zusatzgewicht darf leer bleiben
        const complete = s => !!s.r && (ex.ll || s.w != null);
        row.appendChild(el("div","si",String(i+1)));
        const wI = el("input"); wI.type="number"; wI.step="0.5"; wI.inputMode="decimal"; wI.placeholder = last && last.sets[i] ? String(last.sets[i].w||"–") : "–"; wI.value = cur.w!=null?cur.w:"";
        const rI = el("input"); rI.type="number"; rI.inputMode="numeric"; rI.placeholder = String(ex.reps[0]); rI.value = cur.r!=null?cur.r:"";
        const tick = el("div","tick"+(complete(cur)?" on":""),"✓");
        const upd = ()=>{
          const s = S.logs.sessions[t] || (S.logs.sessions[t] = {dayName:day.name, entries:{}});
          const arr = s.entries[ex.id] || (s.entries[ex.id] = []);
          arr[i] = {w: wI.value===""?null:Number(wI.value), r: rI.value===""?null:Number(rI.value), ll: !!ex.ll};
          tick.classList.toggle("on", complete(arr[i]));
          save(); renderRail();
        };
        wI.onchange = upd; rI.onchange = upd;
        row.appendChild(wI); row.appendChild(rI); row.appendChild(tick);
        box.appendChild(row);
      }
      box.appendChild(el("div","cue","<b>Nächster Schritt:</b> "+esc(suggestion(ex,last))+"<br>"+esc(e.cue)));
      body.appendChild(box);
    });
    c.appendChild(body);

    const foot = el("div","card-b");
    const done = el("button","btn primary wide","Einheit abschließen");
    done.onclick = ()=>{
      const s = S.logs.sessions[t] || (S.logs.sessions[t] = {dayName:day.name, entries:{}});
      s.done = true; s.dayName = day.name; save();
      toast("Stark. Einheit gespeichert."); render();
    };
    foot.appendChild(done);
    c.appendChild(foot);
  }
  root.appendChild(c);

  /* Kalorienkarte */
  root.appendChild(kcalCard(tgt, day ? "Trainingstag" : "Ruhetag"));

  /* Gewicht heute */
  const wc = el("div","card");
  const wh = el("div","card-h"); wh.appendChild(el("h2",null,"Gewicht heute")); wc.appendChild(wh);
  const wb = el("div","card-b");

  const wi = el("input"); wi.type="number"; wi.step="0.1"; wi.inputMode="decimal"; wi.style.maxWidth="130px";
  const existing = (S.logs.weights||[]).find(x=> x.date === t);
  wi.value = existing ? existing.kg : "";
  wi.placeholder = String(S.profile.weight);
  const wb2 = el("button","btn primary","Eintragen");
  wb2.onclick = ()=>{
    const v = Number(wi.value); if(!v){ toast("Bitte ein Gewicht eintragen."); return; }
    S.logs.weights = (S.logs.weights||[]).filter(x=> x.date !== t).concat([{date:t, kg:v}]);
    S.profile.weight = v; save(); render(); toast("Gewicht gespeichert.");
  };
  wrow.appendChild(wi); wrow.appendChild(wb2);
  wb.appendChild(wrow);
  wb.appendChild(el("div","hint","Am besten morgens nach dem Aufstehen. Nur der 7-Tage-Schnitt zählt — Tagesschwankungen sind Wasser, nicht Fett."));
  wc.appendChild(wb);
  root.appendChild(wc);
  return root;
}

function nextTrainingDay(){
  const t = today();
  for(let i=1;i<=7;i++){
    const d = dPlus(t,i), day = planForDate(d);
    if(day) return day;
  }
  return S.plan.days[0];
}

/* ---------- Kalorienkarte (auf "Heute" und in "Ernährung") ---------------- */
function kcalCard(tgt, kind){
  const t = today(), list = S.logs.food[t] || [];
  const sum = list.reduce((a,f)=>({kcal:a.kcal+f.kcal, protein:a.protein+f.protein, carbs:a.carbs+f.carbs, fat:a.fat+f.fat}),
                          {kcal:0,protein:0,carbs:0,fat:0});
  const c = el("div","card");
  const h = el("div","card-h");
  h.appendChild(el("h2",null,"Kalorien heute"));
  h.appendChild(el("span","chip fuel",esc(kind)));
  h.appendChild(el("div","sub", r0(sum.kcal)+" von "+tgt.kcal+" kcal"));
  c.appendChild(h);
  const b = el("div","card-b stack");

  const left = tgt.kcal - sum.kcal;
  const bn = el("div","bignum");
  bn.appendChild(el("div","v", (left<0?"+":"") + r0(Math.abs(left))));
  bn.appendChild(el("div","u", left<0 ? "kcal über dem Ziel" : "kcal übrig"));
  b.appendChild(bn);

  const bar = el("div","meter");
  const pct = clamp(sum.kcal/tgt.kcal*100, 0, 100);
  bar.appendChild(el("i", "fuel" + (sum.kcal > tgt.kcal*1.05 ? " over" : ""))).style.width = pct+"%";
  b.appendChild(bar);

  [["Eiweiß","protein",4],["Kohlenhydrate","carbs",4],["Fett","fat",9]].forEach(([lbl,k])=>{
    const row = el("div","macrorow");
    row.appendChild(el("div","lbl",esc(lbl)));
    const m = el("div","meter");
    m.appendChild(el("i", k==="protein" ? "" : "fuel")).style.width = clamp(sum[k]/tgt[k]*100,0,100)+"%";
    row.appendChild(m);
    row.appendChild(el("div","val", r0(sum[k])+" / "+tgt[k]+" g"));
    b.appendChild(row);
  });

  const go = el("button","btn wide","Essen eintragen");
  go.onclick = ()=>{ S.ui.tab="ernaehrung"; save(); render(); window.scrollTo({top:0}); };
  b.appendChild(go);
  c.appendChild(b);
  return c;
}

function targetBox(title, m, tone){
  const d = el("div","card");

function bestLifts(){
  const out = {};
  Object.keys(S.logs.sessions).sort().forEach(d=>{
    const s = S.logs.sessions[d];
    Object.keys(s.entries||{}).forEach(id=>{
      (s.entries[id]||[]).forEach(set=>{
        if(!set || !set.r) return;
        const w = Number(set.w) || 0;
        // Mit Gewicht: geschätztes Einwiederholungsmaximum (Epley).
        // Ohne Gewicht zählt die Wiederholungszahl — beides bleibt getrennt.
        const score = w > 0 ? w * (1 + set.r/30) : set.r;
        if(!out[id]) out[id] = {id, bw: w === 0, firstW:w, firstR:set.r};
        if(out[id].score == null || score > out[id].score) Object.assign(out[id], {score, w, r:set.r, date:d});
      });
    });
  });
  return Object.values(out)
    .map(x=>({...x, name:(byId(x.id)||{}).name || x.id}))
    .sort((a,b)=> (b.w||0) - (a.w||0) || b.score - a.score).slice(0,10);
}
/* Für Körpergewichtssätze wird die Last mit dem halben Körpergewicht angesetzt,
   damit das Volumen auch ohne Hanteln vergleichbar bleibt. */
function weeklyVolume(){
  const buckets = {};
  const bwLoad = (S.profile.weight || 70) * 0.5;
  Object.keys(S.logs.sessions).forEach(d=>{
    const s = S.logs.sessions[d];
    let v = 0;
    Object.values(s.entries||{}).forEach(sets=> (sets||[]).forEach(x=>{
      if(x && x.r) v += (Number(x.w) > 0 ? Number(x.w) : bwLoad) * x.r;
    }));
    if(!v) return;
    const dt = new Date(d+"T12:00:00");
    const wdN = (dt.getDay()+6)%7;
    const monday = iso(new Date(dt.getTime() - wdN*864e5));
    buckets[monday] = (buckets[monday]||0) + v;
  });
  return Object.keys(buckets).sort().slice(-8).map(k=>({label:fmtDE(k).slice(3), v:buckets[k]}));
}

/* ---------- Diagramme ------------------------------------------------------ */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = cv.clientHeight || 170;
  cv.width = w*dpr; cv.height = h*dpr;
  const x = cv.getContext("2d"); x.scale(dpr,dpr);
  return {x,w,h};
}
function drawWeight(cv, data, target){
  const {x,w,h} = setupCanvas(cv);
  const pad = {l:38, r:10, t:12, b:20};
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const vals = data.map(d=>d.kg);
  // 7-Tage-Schnitt
  const avg = data.map((d,i)=>{
    const from = dPlus(d.date,-6);
    const sel = data.filter(z=> z.date >= from && z.date <= d.date);
    return sel.reduce((s,z)=>s+z.kg,0)/sel.length;
  });
  let lo = Math.min(...vals, ...(target?[target]:[])), hi = Math.max(...vals, ...(target?[target]:[]));
  const padV = Math.max((hi-lo)*0.18, 0.6); lo -= padV; hi += padV;
  const X = i => pad.l + (data.length===1 ? iw/2 : iw*i/(data.length-1));
  const Y = v => pad.t + ih - ih*(v-lo)/(hi-lo);

  x.clearRect(0,0,w,h);
  x.strokeStyle = css("--line"); x.fillStyle = css("--ink-3");
  x.font = "10px 'Geist Mono', monospace"; x.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const v = lo + (hi-lo)*i/3, y = Y(v);
    x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w-pad.r, y); x.stroke();
    x.fillText(r1(v).toFixed(1), 4, y+3);
  }
  if(target && target>=lo && target<=hi){
    x.save(); x.setLineDash([4,4]); x.strokeStyle = css("--fuel");
    x.beginPath(); x.moveTo(pad.l, Y(target)); x.lineTo(w-pad.r, Y(target)); x.stroke(); x.restore();
  }
  // Fläche unter dem Schnitt
  const grad = x.createLinearGradient(0,pad.t,0,pad.t+ih);
  grad.addColorStop(0, css("--train-soft")); grad.addColorStop(1,"transparent");
  x.beginPath(); x.moveTo(X(0), Y(avg[0]));
  avg.forEach((v,i)=> x.lineTo(X(i), Y(v)));
  x.lineTo(X(avg.length-1), pad.t+ih); x.lineTo(X(0), pad.t+ih); x.closePath();
  x.fillStyle = grad; x.fill();
  // Punkte
  x.fillStyle = css("--ink-3");
  data.forEach((d,i)=>{ x.beginPath(); x.arc(X(i), Y(d.kg), 1.8, 0, 7); x.fill(); });
  // Schnittlinie
  x.strokeStyle = css("--train"); x.lineWidth = 2; x.lineJoin = "round";
  x.beginPath(); avg.forEach((v,i)=> i ? x.lineTo(X(i),Y(v)) : x.moveTo(X(i),Y(v))); x.stroke();
  // Endpunkt betonen
  const li = avg.length-1;
  x.fillStyle = css("--surface"); x.beginPath(); x.arc(X(li), Y(avg[li]), 4.5, 0, 7); x.fill();
  x.strokeStyle = css("--train"); x.lineWidth = 2.5; x.beginPath(); x.arc(X(li), Y(avg[li]), 4.5, 0, 7); x.stroke();
}
function drawBars(cv, rows){
  const {x,w,h} = setupCanvas(cv);
  const pad = {l:44, r:8, t:10, b:20};
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const max = Math.max(...rows.map(r=>r.v)) * 1.12;
  const bw = Math.min(46, iw/rows.length - 8);
  x.clearRect(0,0,w,h);
  x.strokeStyle = css("--line"); x.fillStyle = css("--ink-3"); x.font = "10px 'Geist Mono', monospace";
  for(let i=0;i<=2;i++){
    const v = max*i/2, y = pad.t+ih-ih*i/2;
    x.beginPath(); x.moveTo(pad.l,y); x.lineTo(w-pad.r,y); x.stroke();
    x.fillText(v>=1000 ? r0(v/1000)+"t" : r0(v)+"", 4, y+3);
  }
  rows.forEach((r,i)=>{
    const cx = pad.l + iw*(i+0.5)/rows.length;
    const bh = ih * r.v/max;
    x.fillStyle = i === rows.length-1 ? css("--train") : css("--train-soft");
    x.beginPath();
    if(x.roundRect) x.roundRect(cx-bw/2, pad.t+ih-bh, bw, bh, 3); else x.rect(cx-bw/2, pad.t+ih-bh, bw, bh);
    x.fill();
    x.fillStyle = css("--ink-3"); x.textAlign = "center";
    x.fillText(r.label, cx, h-6); x.textAlign = "left";
  });
}

  const db = el("div","card-b stack");
  db.appendChild(el("p",null,"Alles liegt nur in diesem Browser. Für ein Backup oder den Wechsel aufs Handy: den Text unten kopieren und drüben wieder einfügen."));

  const ta = el("textarea"); ta.rows = 5; ta.spellcheck = false;
  ta.placeholder = "Hier erscheint dein Backup — oder füge hier JSON zum Importieren ein.";
  ta.style.cssText = "font-family:'Geist Mono',monospace; font-size:11.5px; resize:vertical";
  db.appendChild(ta);

  const row = el("div","btnrow");

  const exp = el("button","btn","Backup anzeigen");
  exp.onclick = ()=>{
    ta.value = JSON.stringify(S);
    ta.focus(); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(
      ()=> toast("Backup in die Zwischenablage kopiert."),
      ()=> toast("Backup steht im Feld — bitte manuell kopieren.")
    );
    else toast("Backup steht im Feld — bitte manuell kopieren.");
  };
  row.appendChild(exp);

  const imp = el("button","btn","Aus dem Feld importieren");
  imp.onclick = ()=>{
    if(!ta.value.trim()){ toast("Bitte erst JSON in das Feld einfügen."); return; }
    let d;
    try{ d = JSON.parse(ta.value); }
    catch(e){ toast("Das ist kein gültiges JSON."); return; }
    const msg = importAny(d);
    save(); render(); window.scrollTo({top:0}); toast(msg);
  };
  row.appendChild(imp);

  let armed = false;
  const res = el("button","btn ghost","Alles zurücksetzen");
  res.onclick = ()=>{
    if(!armed){
      armed = true; res.textContent = "Wirklich? Nochmal tippen zum Löschen";
      res.style.borderColor = "var(--crit)"; res.style.color = "var(--crit)";
      setTimeout(()=>{ armed = false; res.textContent = "Alles zurücksetzen"; res.style.borderColor=""; res.style.color=""; }, 4000);
      return;
    }
    S = blank(); save(); W = {step:0,data:{}}; render(); window.scrollTo({top:0});
  };
  row.appendChild(res);
  db.appendChild(row);
  db.appendChild(el("div","note","<b>Kalorienzähler übernehmen:</b> JSON mit <span class='mono'>{\"food\":{\"2026-08-15\":[{\"name\":…,\"kcal\":…}]}}</span>, eine flache Liste unter <span class='mono'>entries</span> oder Gewichte unter <span class='mono'>weights</span> werden automatisch erkannt und dazugemischt. Bestehende Einträge bleiben erhalten."));
  dc.appendChild(db);
  root.appendChild(dc);

  const ic = el("div","card");
  const ih2 = el("div","card-h"); ih2.appendChild(el("h2",null,"Zur Einordnung")); ic.appendChild(ih2);
  const ib2 = el("div","card-b");
  ib2.appendChild(el("p",null,"Die Formeln hier sind gute Schätzungen, keine Messwerte — dein echter Bedarf kann 10–15 % daneben liegen. Deshalb korrigiert die App nach dem, was auf der Waage passiert, und nicht nach der Formel. Bei Vorerkrankungen, Medikamenten oder Schmerzen: bitte vorher mit Arzt oder Physiotherapie sprechen."));
  ic.appendChild(ib2);
  root.appendChild(ic);
  return root;
}
function mkSelect(parent, label, opts, val){
  const f = el("div","field");
  f.appendChild(el("label",null,esc(label)));
  const s = el("select");
  opts.forEach(([v,t])=>{ const o = el("option",null,esc(t)); o.value = v; s.appendChild(o); });
  s.value = val; f.appendChild(s); parent.appendChild(f);
  return s;
}

/* Import: eigenes Format + fremde Kalorienzähler-Exporte */
function importAny(d){
  if(d && d.profile && d.plan){
    S = {...blank(), ...d, logs:{...blank().logs, ...(d.logs||{})}};
    return "Backup vollständig geladen.";
  }
  let food = 0, weights = 0;
  const addFood = (date, item)=>{
    if(!date || !item) return;
    const kcal = Number(item.kcal ?? item.calories ?? item.kalorien ?? 0);
    if(!kcal) return;
    (S.logs.food[date] = S.logs.food[date] || []).push({
      name: String(item.name ?? item.title ?? item.bezeichnung ?? "Import"),
      kcal: r0(kcal),
      protein: Number(item.protein ?? item.eiweiss ?? item.p ?? 0),
      carbs: Number(item.carbs ?? item.kohlenhydrate ?? item.c ?? 0),
      fat: Number(item.fat ?? item.fett ?? item.f ?? 0)
    });
    food++;
  };
  if(d && d.food && typeof d.food === "object" && !Array.isArray(d.food)){
    Object.keys(d.food).forEach(date=> (d.food[date]||[]).forEach(it=> addFood(date,it)));
  }
  const flat = Array.isArray(d) ? d : (d.entries || d.eintraege || d.meals || null);
  if(Array.isArray(flat)) flat.forEach(it=> addFood(it.date || it.datum || it.day, it));
  const wl = (d && (d.weights || d.gewicht || d.weight)) || null;
  if(Array.isArray(wl)){
    wl.forEach(it=>{
      const date = it.date || it.datum, kg = Number(it.kg ?? it.weight ?? it.gewicht);
      if(!date || !kg) return;
      S.logs.weights = S.logs.weights.filter(x=> x.date !== date).concat([{date, kg}]);
      weights++;
    });
  }
  if(!food && !weights) return "Nichts Passendes in der Datei gefunden.";
  return food+" Mahlzeiten und "+weights+" Gewichtswerte übernommen.";
}

  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(KEY+".theme", next); }catch(e){}
  if(S.profile && S.plan) render();
};
