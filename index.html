<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nährwerte</title>
<meta name="description" content="Essen fotografieren, Nährwerte und Kalorien pro Tag verfolgen.">
<meta name="theme-color" content="#f97316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nährwerte">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <main id="views">
    <section class="view" id="view-today" hidden></section>
    <section class="view" id="view-capture" hidden></section>
    <section class="view" id="view-training" hidden></section>
    <section class="view" id="view-plan" hidden></section>
    <section class="view" id="view-progress" hidden></section>
    <section class="view" id="view-setup" hidden></section>
    <section class="view" id="view-mobility" hidden></section>
    <section class="view" id="view-report" hidden></section>
    <section class="view" id="view-photos" hidden></section>
    <section class="view" id="view-strength" hidden></section>
    <section class="view" id="view-activity" hidden></section>
    <section class="view" id="view-sleep" hidden></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-favorites" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Mahlzeit per Foto hinzufügen">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="26" height="26">
      <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2a1 1 0 0 0 .83-.45l.74-1.1A1 1 0 0 1 10.1 4h3.8a1 1 0 0 1 .83.45l.74 1.1a1 1 0 0 0 .83.45h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="12" cy="12.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </svg>
  </button>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a class="tab" href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.4v4.9l3.1 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Heute</span>
    </a>
    <a class="tab" href="#/training" data-tab="training">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.2 12h1.6m14.4 0h1.6M6.4 8.6v6.8m11.2-6.8v6.8M9.4 7.4v9.2m5.2-9.2v9.2M9.4 12h5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Training</span>
    </a>
    <a class="tab" href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span>Verlauf</span>
    </a>
    <a class="tab" href="#/favorites" data-tab="favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5.6 1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Favoriten</span>
    </a>
    <a class="tab" href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.6v2.1M12 18.3v2.1M20.4 12h-2.1M5.7 12H3.6m12.9-5.9-1.5 1.5M9 15l-1.5 1.5m9-1.5L15 15M9 9 7.5 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

</div>

<input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
